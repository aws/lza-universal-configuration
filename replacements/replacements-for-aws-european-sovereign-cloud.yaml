      replacement: "          # remediation disabled — AWS::Config::RemediationConfiguration not supported in EUSC\n          # remediation:\n          #   rolePolicyFile: ssm-remediation-roles/elb-logging-enabled-remediation-role.json\n          #   automatic: true\n          #   targetId: \"{{ AcceleratorPrefix }}-SSM-ELB-Enable-Logging\"\n          #   retryAttemptSeconds: 60\n          #   maximumAutomaticAttempts: 5\n          #   parameters:\n          #     - name: LoadBalancerArn\n          #       value: RESOURCE_ID\n          #       type: String\n          #     - name: LogDestination\n          #       value: ${ACCEL_LOOKUP::Bucket:elbLogs}\n          #       type: StringList"

- filename: iam-config.yaml
  items:
    # EUSC: Remove Identity Center delegation (not available)
    - pattern: |
        identityCenter:
          name: "{{ AcceleratorPrefix }}-IdentityCenter"
          delegatedAdminAccount: SharedServices
      replacement: ""

- filename: accounts-config.yaml
  items:
    # EUSC: Add LzaDeploymentAccount for container-based deployment
    - pattern: "  - name: SharedServices"
      replacement: "  - name: LzaDeploymentAccount\n    description: Account to access and manage Landing Zone Accelerator on AWS\n    email: <lzadeployment>@example.com  <----- UPDATE EMAIL ADDRESS\n    organizationalUnit: LzaDeployment\n  - name: SharedServices"
    # EUSC: Add accountIds section after workloadAccounts
    - pattern: "    email: <perimeter>@example.com  <----- UPDATE EMAIL ADDRESS\n    organizationalUnit: Infrastructure"
      replacement: "    email: <perimeter>@example.com  <----- UPDATE EMAIL ADDRESS\n    organizationalUnit: Infrastructure\naccountIds:\n  - email: <lzadeployment>@example.com  <----- UPDATE EMAIL ADDRESS\n    accountId: '111111111111'  <----- UPDATE ACCOUNT ID"

- filename: network-config.yaml
  items:
    # EUSC: Route53 DNS Firewall managed domain lists not supported — comment out rule group definition
    - pattern: "    # Route 53 Resolver DNS Firewall\n    firewallRuleGroups:\n      - name: \"{{ AcceleratorPrefix }}-{{ HomeRegion }}-dns-firewall\"\n        regions:\n          - \"{{ HomeRegion }}\"\n        rules:\n          - name: block-aggregate-threats\n            action: BLOCK\n            blockResponse: NODATA\n            managedDomainList: AWSManagedDomainsAggregateThreatList\n            priority: 100\n          - name: block-malware-domains\n            action: BLOCK\n            blockResponse: NODATA\n            managedDomainList: AWSManagedDomainsMalwareDomainList\n            priority: 200\n          - name: block-botnet-cnc\n            action: BLOCK\n            blockResponse: NODATA\n            managedDomainList: AWSManagedDomainsBotnetCommandandControl\n            priority: 300\n        shareTargets:\n          accounts:\n            - SharedServices\n            - Perimeter\n          organizationalUnits:\n            - Workloads/Dev\n            - Workloads/Test\n            - Workloads/Prod\n        tags:\n          - key: Accelerator\n            value: \"{{ AcceleratorPrefix }}\""
      replacement: "    # Route 53 Resolver DNS Firewall\n    # DISABLED: Managed domain lists not available in EUSC\n    # firewallRuleGroups:\n    #   - name: \"{{ AcceleratorPrefix }}-{{ HomeRegion }}-dns-firewall\"\n    #     regions:\n    #       - \"{{ HomeRegion }}\"\n    #     rules:\n    #       - name: block-aggregate-threats\n    #         action: BLOCK\n    #         blockResponse: NODATA\n    #         managedDomainList: AWSManagedDomainsAggregateThreatList\n    #         priority: 100\n    #       - name: block-malware-domains\n    #         action: BLOCK\n    #         blockResponse: NODATA\n    #         managedDomainList: AWSManagedDomainsMalwareDomainList\n    #         priority: 200\n    #       - name: block-botnet-cnc\n    #         action: BLOCK\n    #         blockResponse: NODATA\n    #         managedDomainList: AWSManagedDomainsBotnetCommandandControl\n    #         priority: 300\n    #     shareTargets:\n    #       accounts:\n    #         - SharedServices\n    #         - Perimeter\n    #       organizationalUnits:\n    #         - Workloads/Dev\n    #         - Workloads/Test\n    #         - Workloads/Prod\n    #     tags:\n    #       - key: Accelerator\n    #         value: \"{{ AcceleratorPrefix }}\""
    # EUSC: Route53 DNS Firewall not supported — comment out dnsFirewallRuleGroups on VPCs
    - pattern: "    dnsFirewallRuleGroups:\n      - name: \"{{ AcceleratorPrefix }}-{{ HomeRegion }}-dns-firewall\"\n        priority: 101\n        mutationProtection: ENABLED"
      replacement: "    # dnsFirewallRuleGroups disabled — managed domain lists not available in EUSC\n    # dnsFirewallRuleGroups:\n    #   - name: \"{{ AcceleratorPrefix }}-{{ HomeRegion }}-dns-firewall\"\n    #     priority: 101\n    #     mutationProtection: ENABLED"
    # EUSC: Bedrock AgentCore endpoints not available — comment out endpoint policies
    - pattern: "  - name: AgentCore-DataPlane\n    document: vpc-endpoint-policies/agentcore-data-plane.json\n  - name: AgentCore-Gateway\n    document: vpc-endpoint-policies/agentcore-gateway.json"
      replacement: "  # AgentCore endpoint policies disabled — services not available in EUSC\n  # - name: AgentCore-DataPlane\n  #   document: vpc-endpoint-policies/agentcore-data-plane.json\n  # - name: AgentCore-Gateway\n  #   document: vpc-endpoint-policies/agentcore-gateway.json"
    # EUSC: Bedrock AgentCore endpoints not available — comment out services
    - pattern: "        # Amazon Bedrock AgentCore endpoints\n        - service: bedrock-agentcore\n        - service: bedrock-agentcore-control\n        - service: bedrock-agentcore.gateway"
      replacement: "        # Amazon Bedrock AgentCore endpoints - not available in EUSC\n        # - service: bedrock-agentcore\n        # - service: bedrock-agentcore-control\n        # - service: bedrock-agentcore.gateway"
    # EUSC: ec2messages endpoint not available (verified via describe-vpc-endpoint-services April 2026)
    - pattern: |
        "        - service: ec2messages"
      replacement: |
        "        # - service: ec2messages - not available in EUSC"
    # EUSC: ECR endpoints use eu.amazonaws prefix — serviceName override required
    - pattern: "        - service: ecr.api\n        - service: ecr.dkr"
      replacement: "        # ECR endpoints use eu.amazonaws prefix in EUSC\n        - service: ecr.api\n          serviceName: eu.amazonaws.eusc-de-east-1.ecr.api\n        - service: ecr.dkr\n          serviceName: eu.amazonaws.eusc-de-east-1.ecr.dkr"
    # EUSC: ssm-incidents endpoint not available (verified via describe-vpc-endpoint-services April 2026)
    - pattern: |
        "        - service: ssm-incidents"
      replacement: |
        "        # - service: ssm-incidents - not available in EUSC"

- filename: organization-config.yaml
  items:
    # EUSC: Add LzaDeployment OU for container-based deployment
    - pattern: "  - name: Infrastructure"
      replacement: "  - name: Infrastructure\n  - name: LzaDeployment"
    # EUSC: Add Deployment Guardrails SCPs for LzaDeployment OU
    - pattern: "  - name: \"{{ AcceleratorPrefix }}-Quarantine-New-Object\""
      replacement: "  - name: \"{{ AcceleratorPrefix }}-Deployment-Guardrails-1\"\n    description: >\n      Protects LZA pipeline-deployed resources (Lambda, IAM roles, CFN stacks, SSM parameters, S3, SNS, Kinesis, EventBridge)\n      from unauthorized modification. Uses scoped Resource patterns to exclude InstallerContainerStack resources.\n    policy: service-control-policies/lza-deployment-guardrails-1.json\n    type: customerManaged\n    deploymentTargets:\n      organizationalUnits:\n        - LzaDeployment\n  - name: \"{{ AcceleratorPrefix }}-Deployment-Guardrails-2\"\n    description: >\n      Restricts networking modifications, enforces encryption for storage services, and provides tag-based deletion\n      protection for all InstallerContainerStack resources.\n    policy: service-control-policies/lza-deployment-guardrails-2.json\n    type: customerManaged\n    deploymentTargets:\n      organizationalUnits:\n        - LzaDeployment\n  - name: \"{{ AcceleratorPrefix }}-Quarantine-New-Object\""
    # EUSC: Declarative policies not supported
    - pattern: |
        declarativePolicies:
          - name: "{{ AcceleratorPrefix }}-Vpc-Block-Public-Access-Guardrail"
            description: >
              Declarative policies for VPC Block Public Access.
              Attached at account level for granular control as some accounts within OUs require exemptions.
            policy: declarative-policies/lza-core-vpc-block-public-access.json
            deploymentTargets:
              organizationalUnits:
                - Security
                - Workloads/Dev
                - Workloads/Test
                - Workloads/Prod
              accounts:
                - Network
                - SharedServices
      replacement: ""
    # EUSC: Resource Control Policies not supported
    - type: deleteBlock
      startMarker: "resourceControlPolicies:"
      endMarker: "serviceControlPolicies:"
      endInclusive: false
      replacement: ""
    # EUSC: Tagging policies not supported
    - pattern: |
        taggingPolicies:
          # AWS Organizations Tagging Policies
          # - Enables tag policy for values of backup plans only
          # - This will only enforce the tag value specified matches one of the backup plans
          #   - Redshift, RDS, Timestream, DocumentDB, Neptune cannot currently be enforced
          #   - VMWare VMs are outside of scope for tag enforcement
          - name: OrgTagPolicy
            description: Organization Tagging Policy
            policy: tagging-policies/org-tag-policy.json
            deploymentTargets:
              organizationalUnits:
                - Infrastructure
                - Workloads
          # AWS Backup continuous backup is only supported for S3 & RDS but RDS isn't supported by tag policies.
          #   - https://docs.aws.amazon.com/aws-backup/latest/devguide/point-in-time-recovery.html
          - name: S3TagPolicy
            description: S3 Tagging Policy
            policy: tagging-policies/s3-tag-policy.json
            deploymentTargets:
              organizationalUnits:
                - Infrastructure
                - Workloads
      replacement: |
        taggingPolicies: []
    # EUSC: Backup policies not supported
    - pattern: |
        backupPolicies:
          # AWS Backup Configuration
          # https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_backup.html
          # Syntax: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_backup_syntax.html?icmpid=docs_orgs_console
          # - Retention is set for 1 year
          #   - Continuous is set to max of 35 days
          #   - Monthly is set for two years
          # - VSS Enabled (Windows) for all plans
          #   - https://docs.aws.amazon.com/aws-backup/latest/devguide/windows-backups.html
          # - Available Backup Plans
          #   - Continuous
          #   - Hourly
          #   - Daily
          #   - Weekly
          #   - Monthly
          # - Backup Window
          #   - Set to AWS Backup default of 5am UTC
          # - Tag policy with list of backup plans has been created for you, if changes in policies are made you should also update this tag policy too
          - name: "{{ AcceleratorPrefix }}-BackupPolicy"
            description: Organization Backup Policy
            policy: backup-policies/primary-backup-plan.json
            deploymentTargets:
              organizationalUnits:
                - Infrastructure
                - Workloads
      replacement: |
        backupPolicies: []

- filename: replacements-config.yaml
  items:
    # Remove BudgetsEmail replacement since CUR/Budgets are not available in EUSC
    - pattern: |
        "  # AWS Budgets Notification Emails"
        "  - key: BudgetsEmail"
        "    type: String"
        "    value: <budget-notifications>@example.com  <----- UPDATE EMAIL ADDRESS"
        ""
      replacement: ""
    # EUSC: Update HomeRegion and EnabledRegions to EUSC region
    - pattern: |
        globalReplacements:
          # Accelerator Prefix
          - key: AcceleratorPrefix
            type: String
            value: AWSAccelerator
          # Home Region
          - key: HomeRegion
            type: String
            value: us-east-1 # <----- UPDATE TO YOUR HOME REGION
          - key: EnabledRegions
            type: StringList
            value:
              - "us-east-1" # <----- UPDATE TO INCLUDE HOME REGION + ADDITIONAL REGIONS TO ENABLE
              # - "us-west-2" # <----- ADD ADDITIONAL REGIONS AS NEEDED
      replacement: |
        globalReplacements:
          # Accelerator Prefix
          - key: AcceleratorPrefix
            type: String
            value: AWSAccelerator
          # Accelerator Qualifier (container deployment)
          - key: AcceleratorQualifier
            type: String
            value: lza1  # <----- UPDATE TO MATCH AcceleratorQualifier in the installer stack
          # Home Region
          - key: HomeRegion
            type: String
            value: eusc-de-east-1 # <----- UPDATE TO YOUR HOME REGION
          - key: EnabledRegions
            type: StringList
            value:
              - "eusc-de-east-1" # <----- UPDATE TO INCLUDE HOME REGION + ADDITIONAL REGIONS TO ENABLE


# Post-processing actions (applied after all file replacements)
# Removes folders that are no longer referenced after replacements are applied
- postActions:
    - type: removeFolder
      folders:
        - declarative-policies
        - rcp-policies
        - backup-policies
        - tagging-policies

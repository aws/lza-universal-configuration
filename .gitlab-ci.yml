image: public.ecr.aws/amazonlinux/amazonlinux:2023

stages:
  - validate
  - deploy-dev-wave-1
  - deploy-dev-wave-2
  - promote-test
  - deploy-test
  - promote-prod
  - deploy-prod
  - release

workflow:
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[skip ci\]/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_TAG =~ /v(\d.+){2}\d/
      when: always
    - if: $CI_COMMIT_BRANCH == "dev"
      when: always
    - if: $CI_COMMIT_BRANCH == "main"
      when: always

# Toolchain for every job on the Amazon Linux image. All packages come from
# Amazon's own repositories, so jobs do not depend on third-party archive mirrors.
.al2023_tools:
  before_script:
    - dnf install -q -y nodejs22 nodejs22-npm awscli-2 zip unzip tar gzip

validate:
  stage: validate
  before_script:
    - !reference [.al2023_tools, before_script]
  script:
    - curl -s -o viperlight.zip https://viperlight-scanner.s3.amazonaws.com/latest/viperlight.zip
    - unzip -q viperlight.zip -d ../viperlight
    - rm -r ./viperlight.zip
    - echo "Content scanning utility installation complete `date`"
    - echo "Starting content scanning `date` in `pwd`"
    - ../viperlight/bin/viperlight scan
    - echo "Completed content scanning `date`"
  rules:
    - when: always

release:
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  stage: release
  variables:
    DEFAULT_HUB_SPOKE: lza-universal-config-hub-and-spoke-${CI_COMMIT_TAG}.zip
    DEFAULT_SHARED_VPC: lza-universal-config-shared-vpc-${CI_COMMIT_TAG}.zip
    DEFAULT_AWS_GOVCLOUD_US: lza-universal-config-for-aws-govcloud-us-${CI_COMMIT_TAG}.zip
    DEFAULT_AWS_EUSC: lza-universal-config-for-aws-european-sovereign-cloud-${CI_COMMIT_TAG}.zip
  before_script:
    - apk add --no-cache nodejs npm zip
  script:
    - cd scripts
    - npm install
    - node release-package.js -n hub-and-spoke -v $CI_COMMIT_TAG -o ../$DEFAULT_HUB_SPOKE -r ../replacements/replacements-for-aws-standard.yaml --upload
    - node release-package.js -n shared-vpc -v $CI_COMMIT_TAG -o ../$DEFAULT_SHARED_VPC -r ../replacements/replacements-for-aws-standard.yaml --upload
    - node release-package.js -n hub-and-spoke -v $CI_COMMIT_TAG -o ../$DEFAULT_AWS_GOVCLOUD_US -r ../replacements/replacements-for-aws-govcloud-us.yaml --upload
    - node release-package.js -n hub-and-spoke -v $CI_COMMIT_TAG -o ../$DEFAULT_AWS_EUSC -r ../replacements/replacements-for-aws-european-sovereign-cloud.yaml --upload
  artifacts:
    paths:
      - ${DEFAULT_HUB_SPOKE}.zip
      - ${DEFAULT_SHARED_VPC}.zip
      - ${DEFAULT_AWS_GOVCLOUD_US}.zip
      - ${DEFAULT_AWS_EUSC}.zip
  rules:
    - if: $CI_COMMIT_TAG =~ /v(\d.+){2}\d/
      when: always
    - when: never
  release:
    tag_name: "$CI_COMMIT_TAG"
    description: "$CI_COMMIT_TAG"
    ref: "$CI_COMMIT_SHA"
    assets:
      links:
        - name: $DEFAULT_HUB_SPOKE
          url: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/lza-universal-config/${CI_COMMIT_TAG}/${DEFAULT_HUB_SPOKE}
        - name: $DEFAULT_SHARED_VPC
          url: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/lza-universal-config/${CI_COMMIT_TAG}/${DEFAULT_SHARED_VPC}
        - name: $DEFAULT_AWS_GOVCLOUD_US
          url: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/lza-universal-config/${CI_COMMIT_TAG}/${DEFAULT_AWS_GOVCLOUD_US}
        - name: $DEFAULT_AWS_EUSC
          url: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/lza-universal-config/${CI_COMMIT_TAG}/${DEFAULT_AWS_EUSC}

# ===========================================================================
# DEPLOY TEMPLATE
# ===========================================================================
# Single parameterized template replacing .base_with_hub_and_spoke and
# .base_with_shared_vpc. The NETWORK_TYPE variable controls which network
# module is assembled and which multi-region script is executed.
#
# NETWORK_TYPE values: "hub-and-spoke" or "shared-vpc"

.deploy:
  resource_group: ${ENVIRONMENT_NAME}-${AWS_DEFAULT_REGION}
  # Project has auto-cancel-redundant-pipelines enabled; interruptible: false
  # keeps a running deploy from being cancelled when a newer commit lands on
  # the branch. Without this, cancellation would strand the AWSAccelerator-
  # Pipeline execution that is already running in the target AWS account.
  interruptible: false
  environment:
    name: ${ENVIRONMENT_NAME}/${AWS_DEFAULT_REGION}
  before_script:
    - !reference [.al2023_tools, before_script]
  script:
    - cd modules
    - mkdir temp
    - cp -r base/default/* temp/
    - |
      if [ -z "$NETWORK_TYPE" ]; then
        echo "Error: NETWORK_TYPE variable is not set" && exit 1
      fi
      if [ ! -d "network/${NETWORK_TYPE}" ]; then
        echo "Error: Network type directory 'network/${NETWORK_TYPE}' does not exist" && exit 1
      fi
      cp -r "network/${NETWORK_TYPE}/"* temp/
    - cd ../scripts
    - npm install
    - node index.js ../modules/temp/
    - |
      if [ "$NETWORK_TYPE" = "hub-and-spoke" ]; then
        node hub-spoke-multi-region.js ../modules/temp/
      elif [ "$NETWORK_TYPE" = "shared-vpc" ]; then
        node shared-vpc-testing.js ../modules/temp/
        node shared-vpc-multi-region.js ../modules/temp/
      else
        echo "Error: Invalid NETWORK_TYPE '$NETWORK_TYPE'. Must be 'hub-and-spoke' or 'shared-vpc'" && exit 1
      fi
    - node validate-network-config.js ../modules/temp/
    - cd ../modules/temp
    - zip -r ../../aws-accelerator-config.zip . &>/dev/null
    - cd ../..
    # Get local file size
    - LOCAL_SIZE=$(stat -c%s aws-accelerator-config.zip)
    - echo "Uploading ${LOCAL_SIZE} bytes to ${CONFIG_BUCKET_NAME}"
    # Upload file
    - aws s3 cp aws-accelerator-config.zip s3://${CONFIG_BUCKET_NAME}/zipped/aws-accelerator-config.zip
    # Verify upload
    - |
      echo "Verifying upload..."
      S3_SIZE=$(aws s3api head-object --bucket ${CONFIG_BUCKET_NAME} --key zipped/aws-accelerator-config.zip --query 'ContentLength' --output text)
      echo "Local: ${LOCAL_SIZE} bytes, S3: ${S3_SIZE} bytes"
      if [ "$LOCAL_SIZE" != "$S3_SIZE" ]; then echo "Upload failed - size mismatch" && exit 1; fi
      echo "Upload verified successfully"
    # Start CodePipeline
    - |
      if [ "$AWS_DEFAULT_REGION" = "$HOME_REGION" ]; then
        PIPELINE_NAME="AWSAccelerator-Pipeline"
        echo "Starting pipeline: ${PIPELINE_NAME} in home region: $HOME_REGION"
        if EXECUTION_ID=$(aws codepipeline start-pipeline-execution --name ${PIPELINE_NAME} --query 'pipelineExecutionId' --output text 2>/dev/null); then
          echo "Pipeline execution started: $EXECUTION_ID"
          while true; do
            if STATUS=$(aws codepipeline get-pipeline-execution --pipeline-name ${PIPELINE_NAME} --pipeline-execution-id $EXECUTION_ID --query 'pipelineExecution.status' --output text 2>/dev/null); then
              echo "Pipeline status: $STATUS"
              case $STATUS in
                "Succeeded") echo "Pipeline completed successfully" && break ;;
                "Failed"|"Cancelled"|"Stopped") echo "Pipeline failed: $STATUS" && exit 1 ;;
                "InProgress") sleep 60 ;;
                *) echo "Unknown status: $STATUS" && exit 1 ;;
              esac
            else
              STATUS=$(aws codepipeline list-pipeline-executions --pipeline-name ${PIPELINE_NAME} --max-items 1 --query 'pipelineExecutionSummaries[0].status' --output text 2>/dev/null)
              echo "Recent status: $STATUS"
              case $STATUS in
                "Succeeded") echo "Pipeline completed successfully" && break ;;
                "Failed"|"Cancelled"|"Stopped") echo "Pipeline failed: $STATUS" && exit 1 ;;
                *) sleep 60 ;;
              esac
            fi
          done
        else
          echo "Failed to start pipeline in home region" && exit 1
        fi
      else
        echo "Skipping pipeline - not home region (current: $AWS_DEFAULT_REGION, home: $HOME_REGION)"
      fi
  artifacts:
    paths:
      - aws-accelerator-config.zip
    expire_in: 1 week


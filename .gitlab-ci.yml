# ===========================================================================
# PROMOTE TO TEST (manual gate between deploy-dev and deploy-test)
# ===========================================================================
# Hidden list of every dev deploy job. The promote waits on all 10 so a
# single click after the full dev tier is green moves the change to test.
# Reused via !reference below.
.all-dev-jobs:
  needs:
    - deploy:dev001:hub-spoke:us-east-1
    - deploy:dev001:hub-spoke:us-west-2
    - deploy:dev001:hub-spoke:ca-central-1
    - deploy:dev001:hub-spoke:ap-southeast-2
    - deploy:dev001:hub-spoke:eu-west-2
    - deploy:dev002:shared-vpc:us-east-1
    - deploy:dev002:shared-vpc:us-west-2
    - deploy:dev002:shared-vpc:ca-central-1
    - deploy:dev002:shared-vpc:ap-southeast-2
    - deploy:dev002:shared-vpc:eu-west-2

promote:test:
  stage: promote-test
  needs: !reference [.all-dev-jobs, needs]
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      when: manual
      allow_failure: false
  environment:
    name: test
    action: start
    deployment_tier: staging
  script:
    - echo "Promoting ${CI_COMMIT_SHA:0:12} to test"


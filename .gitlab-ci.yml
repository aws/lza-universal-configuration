# ===========================================================================
# PROMOTE TO PROD (manual gate between deploy-test and deploy-prod)
# ===========================================================================
# Hidden list of every test deploy job. The promote waits on all 10 so a
# single click after the full test tier is green moves the change to prod.
.all-test-jobs:
  needs:
    - deploy:test001:hub-spoke:us-east-1
    - deploy:test001:hub-spoke:us-west-2
    - deploy:test001:hub-spoke:ca-central-1
    - deploy:test001:hub-spoke:ap-southeast-2
    - deploy:test001:hub-spoke:eu-west-2
    - deploy:test002:shared-vpc:us-east-1
    - deploy:test002:shared-vpc:us-west-2
    - deploy:test002:shared-vpc:ca-central-1
    - deploy:test002:shared-vpc:ap-southeast-2
    - deploy:test002:shared-vpc:eu-west-2

promote:prod:
  stage: promote-prod
  needs: !reference [.all-test-jobs, needs]
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      when: manual
      allow_failure: false
  environment:
    name: prod
    action: start
    deployment_tier: production
  script:
    - echo "Promoting ${CI_COMMIT_SHA:0:12} to prod"


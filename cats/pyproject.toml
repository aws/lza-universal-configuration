[project]
license = "Apache-2.0"
name = "lza-uc-cats-tests"
# This repository's own release line, tagged as v<version>.
# scripts/export_to_uc.py replaces it with the Universal Configuration release the
# exported tree ships in (--uc-version), so the two version lines never have to agree.
version = "1.4.0"
description = "Controls test pack for the Landing Zone Accelerator Universal Configuration, built on CATS"
authors = [{ name = "LZA Team", email = "lza-team@amazon.com" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Compatible release: engine patch fixes reach a fresh `uv sync`; a new minor is adopted here.
    "aws-cats~=1.0.0",
    "pytest-xdist>=3.8.0,<4.0.0",
    "diskcache>=5.6.3",
]

# Neither group installs by default: a plain `uv sync` gives an operator the engine and the
# tests and nothing else. `uv sync --group mcp` adds `cats mcp` for AI-agent integration (the
# engine keeps its HTTP stack behind an extra); `uv sync --group dev` adds the linters, type
# checker and stubs the cats:lint job runs.
[dependency-groups]
mcp = ["aws-cats[mcp]"]
dev = [
    "mypy>=1.11.2,<2.0.0",
    "ruff>=0.6.9,<1.0.0",
    "pytest>=9.0.3,<10.0.0",
    # Typing-only: every mypy_boto3_* import sits under TYPE_CHECKING (ruff TC rules),
    # so the stubs stay a dev dependency.
    "boto3-stubs[all]>=1.34.139,<2.0.0",
    "types-pyyaml>=6.0.12.20250915",
]


[tool.uv]
package = false
# uv would otherwise install the `dev` group on every `uv sync`.
default-groups = []

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = ["ignore::pytest.PytestAssertRewriteWarning"]
# A parametrize that resolves to nothing is a collection error, never a silent skip. A case
# that legitimately has nothing to test must say so with a pytest.param(..., marks=skip(reason)).
empty_parameter_set_mark = "fail_at_collect"

[tool.ruff]
line-length = 150
exclude = ["lza_types"]

[tool.ruff.lint.per-file-ignores]
# Generated by `cats generate-types`; regeneration would drop a required import and undo
# TYPE_CHECKING moves (whether TC fires depends on the installed engine's import graph)
"cats_types.py" = ["I002", "TC002", "TC003"]

[tool.ruff.lint]
ignore = [
    # Not required: enforce all trailing commas
    "COM812",
    # Nested if-statements are fine to decompose complex boolean logic
    "SIM102",
    # Don't always use a ternary
    "SIM108",
    # Allow "assert"
    "S101",
]

select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # Implicit string concatenation
    "ISC",
    # flake8-pytest-style
    "PT",
    # Warning
    "W",
    # Ruff-specific
    "RUF",
    # Bandit
    "S",
    # Eradicate
    "ERA",
    # Annotations
    "ANN",
    # flake8-type-checking: typing-only imports (mypy_boto3_* stubs) go under TYPE_CHECKING
    # so boto3-stubs stays a dev dependency
    "TC",
]

[tool.ruff.lint.flake8-type-checking]
# pydantic evaluates field annotations at runtime, so their imports must stay live
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]

[tool.ruff.lint.isort]
# Deferred annotations let ruff move typing-only imports under TYPE_CHECKING without quoting
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-implicit-str-concat]
allow-multiline = false

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

# Error output
show_column_numbers = true
show_error_codes = true
show_error_context = true
show_traceback = true
color_output = true
error_summary = true
pretty = true
cache_dir = ".mypy_cache/strict"

# Additional strictness
disallow_any_unimported = true
strict_optional = true
no_implicit_optional = true
warn_no_return = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["numpy"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

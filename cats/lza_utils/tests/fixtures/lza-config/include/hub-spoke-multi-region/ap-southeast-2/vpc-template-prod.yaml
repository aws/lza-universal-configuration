name: "{{ AcceleratorPrefix }}-{{ Region5 }}-prod"
region: "{{ Region5 }}"
deploymentTargets:
  organizationalUnits:
    - Workloads/Prod
ipamAllocations:
  - ipamPoolName: "{{ AcceleratorPrefix }}-{{ Region5 }}-ipam-workloads-prod-pool"
    netmaskLength: {{ HomeRegionProdWorkloadsVpcMaskLength }}
defaultSecurityGroupRulesDeletion: true
internetGateway: false
enableDnsHostnames: true
enableDnsSupport: true
instanceTenancy: default
queryLogs:
  - "{{ AcceleratorPrefix }}-{{ HomeRegion }}-query-logs"
routeTables:
  - name: "{{ AcceleratorPrefix }}-{{ Region5 }}-prod-rt-app-a"
    routes:
      - name: TgwRoute
        destination: 0.0.0.0/0
        type: transitGateway
        target: "{{ AcceleratorPrefix }}-{{ Region5 }}-tgw"
      - name: S3Gateway
        type: gatewayEndpoint
        target: s3
      - name: DynamoDBGateway
        type: gatewayEndpoint
        target: dynamodb
  - name: "{{ AcceleratorPrefix }}-{{ Region5 }}-prod-rt-app-b"
    routes:
      - name: TgwRoute
        destination: 0.0.0.0/0
        type: transitGateway
        target: "{{ AcceleratorPrefix }}-{{ Region5 }}-tgw"
      - name: S3Gateway
        type: gatewayEndpoint
        target: s3
      - name: DynamoDBGateway
        type: gatewayEndpoint
        target: dynamodb
  - name: "{{ AcceleratorPrefix }}-{{ Region5 }}-prod-rt-data-a"
    routes: []
  - name: "{{ AcceleratorPrefix }}-{{ Region5 }}-prod-rt-data-b"
    routes: []
  - name: "{{ AcceleratorPrefix }}-{{ Region5 }}-prod-rt-tgw-a"
    routes:
      - name: TgwRoute
        destination: 0.0.0.0/0
        type: transitGateway
        target: "{{ AcceleratorPrefix }}-{{ Region5 }}-tgw"
  - name: "{{ AcceleratorPrefix }}-{{ Region5 }}-prod-rt-tgw-b"
    routes:
      - name: TgwRoute
        destination: 0.0.0.0/0
        type: transitGateway
        target: "{{ AcceleratorPrefix }}-{{ Region5 }}-tgw"
subnets:
  - name: "{{ AcceleratorPrefix }}-{{ Region5 }}-prod-app-a"
    availabilityZone: a
    routeTable: "{{ AcceleratorPrefix }}-{{ Region5 }}-prod-rt-app-a"
    ipamAllocation:
      ipamPoolName: "{{ AcceleratorPrefix }}-{{ Region5 }}-ipam-workloads-prod-pool"
      netmaskLength: {{ HomeRegionProdWorkloadsAppSubnetMaskLength }}
  - name: "{{ AcceleratorPrefix }}-{{ Region5 }}-prod-app-b"
    availabilityZone: b
    routeTable: "{{ AcceleratorPrefix }}-{{ Region5 }}-prod-rt-app-b"
    ipamAllocation:
      ipamPoolName: "{{ AcceleratorPrefix }}-{{ Region5 }}-ipam-workloads-prod-pool"
      netmaskLength: {{ HomeRegionProdWorkloadsAppSubnetMaskLength }}
  - name: "{{ AcceleratorPrefix }}-{{ Region5 }}-prod-data-a"
    availabilityZone: a
    routeTable: "{{ AcceleratorPrefix }}-{{ Region5 }}-prod-rt-data-a"
    ipamAllocation:
      ipamPoolName: "{{ AcceleratorPrefix }}-{{ Region5 }}-ipam-workloads-prod-pool"
      netmaskLength: {{ HomeRegionProdWorkloadsDataSubnetMaskLength }}
  - name: "{{ AcceleratorPrefix }}-{{ Region5 }}-prod-data-b"
    availabilityZone: b
    routeTable: "{{ AcceleratorPrefix }}-{{ Region5 }}-prod-rt-data-b"
    ipamAllocation:
      ipamPoolName: "{{ AcceleratorPrefix }}-{{ Region5 }}-ipam-workloads-prod-pool"
      netmaskLength: {{ HomeRegionProdWorkloadsDataSubnetMaskLength }}
  - name: "{{ AcceleratorPrefix }}-{{ Region5 }}-prod-tgw-a"
    availabilityZone: a
    routeTable: "{{ AcceleratorPrefix }}-{{ Region5 }}-prod-rt-tgw-a"
    ipamAllocation:
      ipamPoolName: "{{ AcceleratorPrefix }}-{{ Region5 }}-ipam-workloads-prod-pool"
      netmaskLength: 28
    tags:
      - key: SubnetType
        value: "{{ AcceleratorPrefix }}-Tgw"
  - name: "{{ AcceleratorPrefix }}-{{ Region5 }}-prod-tgw-b"
    availabilityZone: b
    routeTable: "{{ AcceleratorPrefix }}-{{ Region5 }}-prod-rt-tgw-b"
    ipamAllocation:
      ipamPoolName: "{{ AcceleratorPrefix }}-{{ Region5 }}-ipam-workloads-prod-pool"
      netmaskLength: 28
    tags:
      - key: SubnetType
        value: "{{ AcceleratorPrefix }}-Tgw"
transitGatewayAttachments:
  - name: "{{ AcceleratorPrefix }}-{{ Region5 }}-prod"
    transitGateway:
      name: "{{ AcceleratorPrefix }}-{{ Region5 }}-tgw"
      account: Network
    routeTableAssociations:
      - "{{ AcceleratorPrefix }}-{{ Region5 }}-tgw-rt-spoke"
    routeTablePropagations:
      - "{{ AcceleratorPrefix }}-{{ Region5 }}-tgw-rt-firewall"
    subnets:
      - "{{ AcceleratorPrefix }}-{{ Region5 }}-prod-tgw-a"
      - "{{ AcceleratorPrefix }}-{{ Region5 }}-prod-tgw-b"
gatewayEndpoints:
  defaultPolicy: Endpoint-Default
  endpoints:
    - service: s3
    - service: dynamodb
useCentralEndpoints: true
dnsFirewallRuleGroups:
  - name: "{{ AcceleratorPrefix }}-{{ Region5 }}-dns-firewall"
    priority: 101
    mutationProtection: ENABLED

name: "{{ AcceleratorPrefix }}-{{ Region3 }}-nfw-policy"
regions:
  - "{{ Region3 }}"
firewallPolicy:
  statelessDefaultActions: ["aws:forward_to_sfe"]
  statelessFragmentDefaultActions: ["aws:forward_to_sfe"]
  statefulRuleGroups:
    - name: "{{ AcceleratorPrefix }}-{{ Region3 }}-nfw-stateful-rule-group"
shareTargets:
  # Firewall rules are shared automatically with Network account (owner)
  # Add additional accounts/Organizational units (OUs) only if broader sharing is required
  accounts: []

name: "{{ AcceleratorPrefix }}-{{ Region4 }}-inspection"
account: Network
region: "{{ Region4 }}"
ipamAllocations:
  - ipamPoolName: "{{ AcceleratorPrefix }}-{{ Region4 }}-ipam-inspection-pool"
    netmaskLength: {{ HomeRegionInspectionVpcMaskLength }}
defaultSecurityGroupRulesDeletion: true
internetGateway: false
enableDnsHostnames: true
enableDnsSupport: true
instanceTenancy: default
queryLogs:
  - "{{ AcceleratorPrefix }}-{{ HomeRegion }}-query-logs"
routeTables:
  - name: "{{ AcceleratorPrefix }}-{{ Region4 }}-inspection-rt-tgw-a"
    routes:
      - name: TgwRoute
        destination: 0.0.0.0/0
        type: networkFirewall
        target: "{{ AcceleratorPrefix }}-{{ Region4 }}-nfw"
        targetAvailabilityZone: a
  - name: "{{ AcceleratorPrefix }}-{{ Region4 }}-inspection-rt-tgw-b"
    routes:
      - name: TgwRoute
        destination: 0.0.0.0/0
        type: networkFirewall
        target: "{{ AcceleratorPrefix }}-{{ Region4 }}-nfw"
        targetAvailabilityZone: b
  - name: "{{ AcceleratorPrefix }}-{{ Region4 }}-inspection-rt-fw-a"
    routes:
      - name: TgwRoute
        destination: 0.0.0.0/0
        type: transitGateway
        target: "{{ AcceleratorPrefix }}-{{ Region4 }}-tgw"
  - name: "{{ AcceleratorPrefix }}-{{ Region4 }}-inspection-rt-fw-b"
    routes:
      - name: TgwRoute
        destination: 0.0.0.0/0
        type: transitGateway
        target: "{{ AcceleratorPrefix }}-{{ Region4 }}-tgw"
subnets:
  - name: "{{ AcceleratorPrefix }}-{{ Region4 }}-inspection-fw-a"
    availabilityZone: a
    routeTable: "{{ AcceleratorPrefix }}-{{ Region4 }}-inspection-rt-fw-a"
    ipamAllocation:
      ipamPoolName: "{{ AcceleratorPrefix }}-{{ Region4 }}-ipam-inspection-pool"
      netmaskLength: {{ HomeRegionInspectionFwSubnetMaskLength }}
  - name: "{{ AcceleratorPrefix }}-{{ Region4 }}-inspection-fw-b"
    availabilityZone: b
    routeTable: "{{ AcceleratorPrefix }}-{{ Region4 }}-inspection-rt-fw-b"
    ipamAllocation:
      ipamPoolName: "{{ AcceleratorPrefix }}-{{ Region4 }}-ipam-inspection-pool"
      netmaskLength: {{ HomeRegionInspectionFwSubnetMaskLength }}
  - name: "{{ AcceleratorPrefix }}-{{ Region4 }}-inspection-tgw-a"
    availabilityZone: a
    routeTable: "{{ AcceleratorPrefix }}-{{ Region4 }}-inspection-rt-tgw-a"
    ipamAllocation:
      ipamPoolName: "{{ AcceleratorPrefix }}-{{ Region4 }}-ipam-inspection-pool"
      netmaskLength: 28
    tags:
      - key: SubnetType
        value: "{{ AcceleratorPrefix }}-Tgw"
  - name: "{{ AcceleratorPrefix }}-{{ Region4 }}-inspection-tgw-b"
    availabilityZone: b
    routeTable: "{{ AcceleratorPrefix }}-{{ Region4 }}-inspection-rt-tgw-b"
    ipamAllocation:
      ipamPoolName: "{{ AcceleratorPrefix }}-{{ Region4 }}-ipam-inspection-pool"
      netmaskLength: 28
    tags:
      - key: SubnetType
        value: "{{ AcceleratorPrefix }}-Tgw"
transitGatewayAttachments:
  - name: "{{ AcceleratorPrefix }}-{{ Region4 }}-inspection"
    transitGateway:
      name: "{{ AcceleratorPrefix }}-{{ Region4 }}-tgw"
      account: Network
    options:
      applianceModeSupport: enable # This is required to ensure symmetric routing and maintain stateful inspection capabilities
    routeTableAssociations:
      - "{{ AcceleratorPrefix }}-{{ Region4 }}-tgw-rt-firewall"
    routeTablePropagations: []
    subnets:
      - "{{ AcceleratorPrefix }}-{{ Region4 }}-inspection-tgw-a"
      - "{{ AcceleratorPrefix }}-{{ Region4 }}-inspection-tgw-b"
useCentralEndpoints: true
dnsFirewallRuleGroups:
  - name: "{{ AcceleratorPrefix }}-{{ Region4 }}-dns-firewall"
    priority: 101
    mutationProtection: ENABLED
